<a class="skip-link" href="#main-content">Skip to content</a><header class="app-header"><a routerLink="/home" class="brand">NOVA <span>BANK</span></a><nav aria-label="Primary"><a routerLink="/home">Home</a></nav><details class="profile"><summary>{{auth.session()?.user?.fullName}}</summary><div><p>{{auth.session()?.user?.username}}</p><p class="small muted">{{auth.session()?.user?.role}}</p><button (click)="auth.logout()">Log out</button></div></details></header><main id="main-content" class="content"><router-outlet/></main>
<dialog #idleDialog aria-modal="true" aria-labelledby="idle-title" (cancel)="$event.preventDefault(); keepAlive()"><h2 id="idle-title">Are you still there?</h2><p>For your security, you will be signed out in <strong>{{auth.countdown()}}</strong> seconds.</p><p class="small" aria-live="polite">Your session is inactive.</p><div class="dialog-actions"><button class="primary" autofocus (click)="keepAlive()">Keep me signed in</button><button (click)="auth.logout()">Log out now</button></div></dialog>

services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes: [nova-db:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d postgres']
      interval: 5s
      timeout: 3s
      retries: 15
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/postgres
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-nova}
      JWT_SECRET: ${JWT_SECRET:-local-demonstration-only-signing-key-replace-before-deploy}
      DEPLOYMENT: ${DEPLOYMENT:-local}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/api/health]
      interval: 10s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    ports: ['${FRONTEND_PORT:-4200}:80']
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, http://localhost/]
      interval: 10s
      timeout: 3s
      retries: 10
volumes:
  nova-db:
